{% load static portfolio_tags %}<!doctype html>
<html lang="{{ t.html_lang }}" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f19">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}My Rezume{% endblock %}</title>
  {% block meta %}{% endblock %}
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Onest:wght@500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script>document.documentElement.classList.replace('no-js', 'js');</script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">{% if lang == 'uz' %}Asosiy kontentga o‘tish{% else %}Перейти к содержимому{% endif %}</a>
  <div class="bg-decor" aria-hidden="true"><div class="bg-grid"></div><div class="bg-glow"></div></div>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
