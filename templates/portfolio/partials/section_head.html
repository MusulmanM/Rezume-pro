<div class="section-head{% if align %} section-head--{{ align }}{% endif %}" data-reveal>
  <p class="eyebrow"><span class="eyebrow__num">{{ number }}</span><span class="eyebrow__line" aria-hidden="true"></span>{{ label }}</p>
  <h2 class="h2">{{ title }}</h2>
  {% if subtitle %}<p class="lead">{{ subtitle }}</p>{% endif %}
</div>
