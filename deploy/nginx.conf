# nginx site for My Rezume. __SERVER_NAME__ and __APP_DIR__ are replaced by deploy/setup.sh.
# HTTPS: after DNS points to the server run `certbot --nginx -d example.uz -d www.example.uz`.

limit_req_zone $binary_remote_addr zone=rezume_contact:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias __APP_DIR__/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias __APP_DIR__/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    location = /contact/ {
        limit_req zone=rezume_contact burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:8000;
    }
}
